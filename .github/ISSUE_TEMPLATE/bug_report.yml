name: 🐛 Bug Report
description: 报告一个 bug,帮我们复现和修复
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢你提 Bug!请尽量详细地描述问题,信息越完整我们越能快速定位。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 清晰简洁地描述 bug
      placeholder: |
        X 操作后,预期 Y,实际 Z
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 一步步列出如何触发
      placeholder: |
        1. 启动 `docker compose up`
        2. 访问 http://localhost:5173
        3. 上传文件 X
        4. 看到报错 Y
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你认为应该发生什么
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 日志
      description: 粘贴相关截图、`docker compose logs` 输出等

  - type: input
    id: version
    attributes:
      label: 版本
      description: 哪个版本?(git tag 或 commit)
      placeholder: v0.1.0

  - type: dropdown
    id: env
    attributes:
      label: 运行环境
      options:
        - Docker Compose (本地)
        - Vite dev (本地)
        - 生产部署
        - 其他
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS
        - Linux
        - Windows
        - 其他

  - type: checkboxes
    id: checks
    attributes:
      label: 自查
      options:
        - label: 我已搜索过现有 issue,确认没人提过同样的问题
          required: true
        - label: 我能在最新 main 上复现
          required: true
