name: ✨ Feature Request
description: 提议一个新功能
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        提议新功能前请先看一下 [ROADMAP.md](docs/ROADMAP.md) 确认没在计划中。

  - type: textarea
    id: problem
    attributes:
      label: 解决了什么问题
      description: 你的痛点是什么?没有这个功能时你在用什么 workaround?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 提议的方案
      description: 描述你期望的功能行为
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他方案
      placeholder: |
        - 用现有组件组合实现
        - 第三方库 X 已能解决
        - ...

  - type: textarea
    id: context
    attributes:
      label: 补充上下文
      description: 截图、参考链接、相关 issue
