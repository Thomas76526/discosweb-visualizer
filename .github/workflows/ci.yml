name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 取消旧 run,加快反馈
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- 后端:类型检查 + lint ----
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Ruff lint
        run: ruff check .

      - name: Mypy type check
        run: mypy app/

      # pytest 阶段先跳过,等 M1 加了测试再启用
      # - name: Run tests
      #   run: pytest -q

  # ---- 前端:类型检查 + build ----
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # 首次还没有 lockfile,改用 npm install;
        # 等首次合并后再切 `npm ci`
        run: npm install --no-audit --no-fund || npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  # ---- Docker 镜像构建(不 push)----
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: discosweb-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: discosweb-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- 所有检查通过才算 success ----
  ci-success:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: ${{ success() }}
    steps:
      - run: echo "✅ All CI checks passed"
